services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: supagloo
      POSTGRES_PASSWORD: supagloo
      # Pin to the built-in `postgres` maintenance db so the image does NOT
      # auto-create a db named after POSTGRES_USER. That makes the init script
      # below the single source of truth for BOTH logical databases, and lets
      # its `CREATE DATABASE supagloo;` be unconditional (no "already exists").
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # First-run init: creates `supagloo` (app) + `supagloo_dbos` (DBOS system).
      - ./infra/pg-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supagloo"]
      interval: 5s
      timeout: 5s
      retries: 12
    ports:
      - "5432:5432"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: supagloo
      MINIO_ROOT_PASSWORD: supagloo-dev
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # web console

  # One-shot: wait for MinIO to accept connections, then create the dev bucket.
  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        until mc alias set local http://minio:9000 supagloo supagloo-dev; do
          echo 'minio-init: waiting for minio...'
          sleep 1
        done
        mc mb --ignore-existing local/supagloo-dev
        echo 'minio-init: bucket supagloo-dev ready'

  # One-shot: apply database-lib's Prisma migrations to the `supagloo` app db,
  # then exit. `prisma migrate deploy` reads the schema + migrations shipped
  # inside @supagloo/database-lib via the api image's prisma.config.ts. The `api`
  # service waits for this to complete successfully before starting.
  # NOTE: build context is the api submodule (production form). A local,
  # gitignored docker-compose.override.yml redirects it to ../supagloo-nodejs-api
  # to build in-flight code before the submodule pointer is bumped.
  migrate:
    build:
      context: ./supagloo-nodejs-api
      dockerfile: Dockerfile
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      DATABASE_URL: postgres://supagloo:supagloo@postgres:5432/supagloo
    depends_on:
      postgres:
        condition: service_healthy

  # Fastify API. Public, unversioned GET /healthz -> 200 {"status":"ok"}.
  api:
    build:
      context: ./supagloo-nodejs-api
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://supagloo:supagloo@postgres:5432/supagloo
      # Task #18 (design-delta §5.1): the DBOS SYSTEM db the API enqueues git-ops jobs
      # to via DBOSClient (the same system db the `dbos:` worker consumes). Distinct
      # from DATABASE_URL (the app db). The API never runs the DBOS runtime.
      DBOS_DATABASE_URL: postgres://supagloo:supagloo@postgres:5432/supagloo_dbos
      PORT: "4000"
      HOST: 0.0.0.0
      NODE_ENV: production
      # Required (fail-fast at boot) — shared by api + dbos, must match exactly.
      # Well-known dev-only value (same one in supagloo-database-lib/.env.example);
      # never use this in prod.
      SECRETS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: supagloo-dev
      S3_ACCESS_KEY: supagloo
      S3_SECRET_KEY: supagloo-dev
      S3_REGION: us-east-1
      # Task #11 GitHub App (design-delta §2.3). Required (fail-fast at boot) —
      # one pair per app registration, shared by api + dbos, NOT hardcoded here
      # since GITHUB_APP_PRIVATE_KEY/GITHUB_APP_CLIENT_SECRET are real secrets.
      # Sourced from a root .env (gitignored; see .env.example) via Compose's
      # built-in ${VAR} substitution. GITHUB_APP_CLIENT_ID/SECRET are api-only
      # (Task #26 create-new-repo JIT user-auth hop — dbos has no user context).
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET}
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  # DBOS worker. Statically-registered durable workflows + queues (git-ops,
  # ai-generation, render). No public HTTP surface (no `ports:`) — work arrives
  # via DBOSClient enqueue against the system db. Two databases: DATABASE_URL is
  # the app db (`supagloo`, where workflows write domain rows); DBOS_DATABASE_URL
  # is the DBOS system db (`supagloo_dbos`, checkpoints/queues — DBOS creates its
  # own tables there on launch). dbos has NO migrate service of its own; it waits
  # for the API's one-shot `migrate` so the app schema exists before workers run.
  # NOTE: build context is the dbos submodule (production form). The gitignored
  # docker-compose.override.yml redirects it to ../supagloo-nodejs-dbos to build
  # in-flight code before the submodule pointer is bumped.
  dbos:
    build:
      context: ./supagloo-nodejs-dbos
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgres://supagloo:supagloo@postgres:5432/supagloo
      DBOS_DATABASE_URL: postgres://supagloo:supagloo@postgres:5432/supagloo_dbos
      NODE_ENV: production
      # Required (fail-fast at boot) — MUST match the api service's value exactly, or
      # decryptSecret fails with AUTH_FAILED when a generation workflow loads a
      # provider credential. Same well-known dev-only value as db-lib's .env.example.
      SECRETS_ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      # Task #32: the S3 (writer) vars the asset-uploading workflows use — same names as the
      # api service. dbos uploads against the internal endpoint (minio:9000); S3_PUBLIC_ENDPOINT
      # is unused by dbos (it never presigns) but kept for name-parity with the api block.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: supagloo-dev
      S3_ACCESS_KEY: supagloo
      S3_SECRET_KEY: supagloo-dev
      S3_REGION: us-east-1
      # Task #17 GitHub App (design-delta §2.3/§7). Required (fail-fast at boot) —
      # git-ops workflows sign App JWTs to mint installation tokens. Same real
      # app registration as the api service's pair; sourced from the root .env
      # (gitignored; see .env.example). dbos has no user context, so it does NOT
      # need GITHUB_APP_SLUG/CLIENT_ID/CLIENT_SECRET (api-only, Task #26).
      GITHUB_APP_ID: ${GITHUB_APP_ID}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY}
      # Task #36 renderWorkflow (design-delta §7 workflow 9). All OPTIONAL — the env
      # schema supplies generous defaults for the three child-process kill deadlines
      # (real sizing/timeout tuning is the load-testing task 45, §9-Q8), and the two
      # fallback audio models are deliberately unset by default: model ids are never
      # hardcoded (§10.9), and an unset model means the render proceeds without that
      # track rather than failing. Sourced from the root .env when present.
      RENDER_MEDIA_TIMEOUT_SECONDS: ${RENDER_MEDIA_TIMEOUT_SECONDS:-3600}
      RENDER_BUNDLE_TIMEOUT_SECONDS: ${RENDER_BUNDLE_TIMEOUT_SECONDS:-900}
      RENDER_INSTALL_TIMEOUT_SECONDS: ${RENDER_INSTALL_TIMEOUT_SECONDS:-900}
      # Step-11 item 9 (R45-1). Remotion's OWN per-frame `delayRender()` budget — a
      # DIFFERENT quantity from RENDER_MEDIA_TIMEOUT_SECONDS above, which is the
      # child-process KILL deadline. Row 45 shipped them EQUAL, which made the Remotion
      # timeout unreachable by construction: its clock starts after browser launch and
      # composition resolution and `waitForReady` adds +3000 ms, so the SIGTERM always won.
      # It MUST stay strictly below RENDER_MEDIA_TIMEOUT_SECONDS × 1000; dbos now refuses
      # to boot otherwise (`loadEnv` cross-field check) and `buildRenderMediaOptions`
      # throws as a second line of defence. So do NOT lower the kill deadline to <= 120 s
      # without lowering this with it.
      RENDER_MEDIA_FRAME_TIMEOUT_MS: ${RENDER_MEDIA_FRAME_TIMEOUT_MS:-120000}
      RENDER_NARRATION_MODEL: ${RENDER_NARRATION_MODEL:-}
      RENDER_MUSIC_MODEL: ${RENDER_MUSIC_MODEL:-}
      # Plan row 42 — the nightly `cleanupOrphanedAssetsWorkflow`. Both OPTIONAL with real
      # defaults (retention 168h = 7 days; dry-run false), so the stack boots unchanged
      # without them. Named here for discoverability: the 7-day window is also the safety
      # property that keeps this container's nightly sweep away from freshly-seeded e2e
      # fixtures, whose age is measured in seconds.
      CLEANUP_RETENTION_HOURS: ${CLEANUP_RETENTION_HOURS:-168}
      CLEANUP_DRY_RUN: ${CLEANUP_DRY_RUN:-false}
      # Step-11 item 12 (R42-3). Per-model batch cap on the sweep's candidate rows, applied
      # as `take` with `orderBy: { createdAt: "asc" }` so a run is bounded at 2 × the cap S3
      # ListObjectsV2 calls and drains the oldest orphans first. MEASURED pre-fix on the live
      # dev DB: 134 + 181 = 315 sequential LISTs inside ONE DBOS step, growing every night,
      # all discarded by a crash partway through.
      CLEANUP_MAX_ITEMS_PER_RUN: ${CLEANUP_MAX_ITEMS_PER_RUN:-500}
    # Plan row 45 / D45.5. `renderWorkflow` drives a headless Chromium in this container.
    # Docker's default /dev/shm is 64MB; Chromium's renderer processes use shared memory
    # and die with a bare, unattributable crash when it runs out. This is a CORRECTNESS
    # guard, not a measurement artifact, so it ships in the base file. Deliberately NO
    # `mem_limit` / `deploy.resources` here — a memory ceiling would change the stack every
    # e2e lane in four repos runs against; a constrained profile belongs in an override.
    shm_size: "1gb"
    depends_on:
      migrate:
        condition: service_completed_successfully
      # Task 62 / §11 (D18-3). `renderWorkflow` uploads output.mp4 + thumb.jpg to the
      # `supagloo-dev` bucket, so the worker needs the one-shot bucket creation to have
      # completed — previously only the `api` waited for it, and a cold
      # `docker compose up` could start the worker first.
      minio-init:
        condition: service_completed_successfully

  nextjs:
    build:
      context: ./supagloo-nextjs
      dockerfile: Dockerfile
      args:
        # Plan row 43 / D43.3 — CORRECTED by Step-11 item 8 (RX-1). A build arg is baked
        # into every image layer and into `docker history`, so the REAL credential must
        # never be one: this is a deliberate non-secret placeholder.
        #
        # THE EARLIER COMMENT HERE WAS WRONG, and the error shipped. It reasoned correctly
        # that the runner stage inherits no ENV from the builder stage, and then concluded
        # that the `environment:` block below therefore supplies the real key to the running
        # container. That conclusion did not hold for statically PRERENDERED routes:
        # `app/layout.tsx` read the key at module scope during `next build`, the value
        # crossed a client-component boundary into the RSC payload, and MEASURED, this exact
        # placeholder ended up in 33 files under `/app/.next` — including `/`, `/gallery`,
        # `/profile`, `/studio`, `/your-videos` and both OAuth callbacks. A container given
        # the correct YV_APP_KEY served the PLACEHOLDER, 200 OK, with no clue anywhere in its
        # env, logs or `docker inspect`.
        #
        # `app/layout.tsx` now reads it per request behind `await connection()`, so the
        # `environment:` block below really is the source of truth — and it is asserted as
        # such by `tests/e2e/boot-hardening.e2e.ts` E-BH8, on the SERVED BYTES, because no
        # static read of this file could ever have caught the above.
        #
        # This value is also no longer load-bearing for the build (a `next build` with
        # YV_APP_KEY unset exits 0). It stays because an undeclared build arg is a warning,
        # and because a container started WITHOUT the runtime bridge must still refuse to
        # boot — which is what makes row 43's negative Compose case a real assertion.
        YV_APP_KEY: build-time-placeholder-not-a-real-key
    environment:
      # Task 43 / D43.3. nextjs reads YV_APP_KEY SERVER-side (it is deliberately not a
      # NEXT_PUBLIC_* var), so this is a RUNTIME env. The root .env spells this credential
      # YOUVERSION_APP_KEY (the backends' name); nextjs's shorter YV_APP_KEY is a
      # pre-existing, documented divergence, bridged here.
      YV_APP_KEY: ${YOUVERSION_APP_KEY}
      # DO NOT add SECRETS_ENCRYPTION_KEY here. nextjs has no DB and no S3 access and never
      # calls encryptSecret/decryptSecret (design-delta §5.1:719-727); its boot validator
      # (`lib/config/env.ts`) REJECTS the variable's presence and the container will refuse
      # to boot. That inversion is task 43's actual nextjs hardening (brief §9 S4), and
      # `tests/unit/compose-config.test.ts` PART V invariant 7 holds it.
    ports:
      - "8000:3000"

volumes:
  pgdata: {}
  minio-data: {}
