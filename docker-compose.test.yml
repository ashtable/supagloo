# TEST-ENABLEMENT overlay. Invoked EXPLICITLY:
#
#   docker compose -f docker-compose.yml [-f docker-compose.override.yml] \
#                  -f docker-compose.test.yml up -d --build
#
# ============================================================================
# WHY THIS FILE STILL EXISTS — READ BEFORE DELETING IT.
# ============================================================================
# It was born (Task #9) as the PROVIDER-STUB overlay. Task 34-E8 deleted the
# openrouter/gloo/youversion stubs; task 62 (design-delta §11, D8/D20) deleted the
# last two — the GitHub REST stub and the local git smart-HTTP server, along with
# the whole `tests/stubs/**` directory — so EVERY e2e lane now reaches real
# github.com / api.github.com. Nothing in this file stubs anything any more.
#
# Its surviving reason to exist is TEST ENABLEMENT, and it is not optional:
#
#   * `NODE_ENV: development` + `SUPAGLOO_ENABLE_TEST_SEED: "1"` double-gate the
#     api's `POST /v1/test/seed` route, which EVERY nextjs real-stack Stagehand
#     spec obtains its real session through. The base compose pins
#     NODE_ENV: production and the Dockerfile bakes ENV NODE_ENV=production, so
#     without BOTH values here that route hard-404s and every real-stack spec
#     fails at its first step. Those two lines are plan row 62 item (a)'s fix.
#
#   * The `S3_*` block points the api at MinIO. `S3_PUBLIC_ENDPOINT` is
#     load-bearing for the render spec's thumbnail proof (E-RR3): the presigned
#     download runs IN THE BROWSER, which cannot resolve the `minio` hostname.
#
# Neither may EVER merge into a plain `docker compose up`. Docker auto-merges only
# `docker-compose.override.yml`, never a `.test.yml`, which is exactly why the
# test-seed gates live here and not in the base file. The root e2e globalSetup (and
# the api / dbos / nextjs ones) add these `-f` flags automatically.
#
# NO GitHub VARIABLE APPEARS BELOW, DELIBERATELY.
# `docker-compose.yml` already substitutes all five real `GITHUB_APP_*` from the
# untracked root `.env`, and the base URLs default to github.com via the api's zod
# schema. Deleting the old overrides IS the whole of row 62 item (b), and item (e)
# dissolves with them: `GITHUB_OAUTH_BASE_URL` is simultaneously a server-side
# token-exchange target AND a browser redirect target, so any Compose-internal
# hostname could only ever satisfy one of the two (that was the
# DNS_PROBE_FINISHED_NXDOMAIN artifact). https://github.com satisfies both.
# `SECRETS_ENCRYPTION_KEY` is likewise NOT overridden (D15) — the old all-zeros
# value here meant the api ENCRYPTED with a key dbos could not DECRYPT with.
# `GITHUB_E2E_PAT_TOKEN` never enters any container: it is host-side harness-only.
#
# `tests/unit/compose-test-overlay.test.ts` enforces all of the above as a
# permanent NO-STUB GUARD, so the pattern cannot creep back.
services:
  api:
    environment:
      # MinIO wiring (Task #13). MinIO is real infra from docker-compose.yml, shared
      # by prod and test compose — it was never part of any stub harness.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: supagloo-dev
      S3_ACCESS_KEY: supagloo
      S3_SECRET_KEY: supagloo-dev
      S3_REGION: us-east-1
      # Task #10's flag-gated `POST /v1/test/seed` seam (plan.md task 23: "obtain a
      # *real* session via the flag-gated POST /v1/test/seed instead of faking
      # browser state"). BOTH gates are required — see the header. DELETING EITHER
      # LINE RE-BREAKS ROW 62 ITEM (a).
      NODE_ENV: development
      SUPAGLOO_ENABLE_TEST_SEED: "1"
