# TEST-ENABLEMENT overlay. Invoked EXPLICITLY:
#
#   docker compose -f docker-compose.yml [-f docker-compose.override.yml] \
#                  -f docker-compose.test.yml up -d --build
#
# ============================================================================
# WHY THIS FILE STILL EXISTS — READ BEFORE DELETING IT.
# ============================================================================
# It was born (Task #9) as the PROVIDER-STUB overlay. Task 34-E8 deleted the
# openrouter/gloo/youversion stubs; task 62 (design-delta §11, D8/D20) deleted the
# last two — the GitHub REST stub and the local git smart-HTTP server, along with
# the whole `tests/stubs/**` directory — so EVERY e2e lane now reaches real
# github.com / api.github.com. Nothing in this file stubs anything any more.
#
# Its surviving reason to exist is TEST ENABLEMENT, and it is not optional:
#
#   * `NODE_ENV: development` + `SUPAGLOO_ENABLE_TEST_SEED: "1"` double-gate the
#     api's `POST /v1/test/seed` route, which EVERY nextjs real-stack Stagehand
#     spec obtains its real session through. The base compose pins
#     NODE_ENV: production and the Dockerfile bakes ENV NODE_ENV=production, so
#     without BOTH values here that route hard-404s and every real-stack spec
#     fails at its first step. Those two lines are plan row 62 item (a)'s fix.
#
#   * The `S3_*` block points the api at MinIO. `S3_PUBLIC_ENDPOINT` is
#     load-bearing for the render spec's thumbnail proof (E-RR3): the presigned
#     download runs IN THE BROWSER, which cannot resolve the `minio` hostname.
#
# Neither may EVER merge into a plain `docker compose up`. Docker auto-merges only
# `docker-compose.override.yml`, never a `.test.yml`, which is exactly why the
# test-seed gates live here and not in the base file. The root e2e globalSetup (and
# the api / dbos / nextjs ones) add these `-f` flags automatically.
#
# EXACTLY TWO GitHub VARIABLES APPEAR BELOW, BOTH NAMED AND BOTH FROM PLAN ROW 66.
# Every other one is still deliberately absent.
#
# `docker-compose.yml` already substitutes all five real `GITHUB_APP_*` from the
# untracked root `.env`, and the base URLs default to github.com via the api's zod
# schema. Deleting the old overrides IS the whole of row 62 item (b). Item (e) was
# that `GITHUB_OAUTH_BASE_URL` is simultaneously a server-side token-exchange target
# AND a browser redirect target, so any Compose-internal hostname could only ever
# satisfy one of the two (the DNS_PROBE_FINISHED_NXDOMAIN artifact). Row 62 dissolved
# it by pointing both at https://github.com; plan row 66 dissolves it structurally, by
# SPLITTING the variable:
#
#   * `GITHUB_OAUTH_BASE_URL` stays PUBLIC and stays ABSENT here — the browser's
#     authorize redirect must resolve from the USER's machine. Overriding it is still
#     forbidden and still recreates item (e).
#   * `GITHUB_OAUTH_INTERNAL_BASE_URL` is the SERVER-side half, used by `exchangeCode`
#     alone. It is safe to point at a Compose hostname precisely because no browser
#     ever sees it. It points the api at ITSELF — no new container, because §10.7
#     ("keeping dead stubs invites quiet re-adoption") and §10.9 ("reintroducing stubs
#     is not a mitigation") rule that out.
#   * `GITHUB_E2E_EXCHANGE_TOKEN` is what the api's double-gated, test-only
#     `POST /login/oauth/access_token` hands back in place of the OAuth-issued user
#     token. Substituted from the untracked root `.env`; NEVER inlined here.
#     CONSEQUENCE, stated so it is not a surprise: with THIS overlay applied and the
#     variable unset, the api REFUSES TO BOOT and says so, naming the variable. That
#     is deliberate (a route that answered with a placeholder would let a browser spec
#     go green while `POST /user/repos` 401s minutes later). A plain
#     `docker compose up` is unaffected — it never sets SUPAGLOO_ENABLE_TEST_SEED, so
#     the route is not registered and the token is never read.
#     WHAT THAT CREDENTIAL IS, accurately: a classic `repo` PAT — NOT the fine-grained
#     "repository-creation only, no `delete_repo`" token this header used to describe.
#     No such token exists: fine-grained `Administration: write` is the SAME permission
#     `DELETE /repos/{o}/{r}` requires, and `delete_repo` is a classic-PAT-only scope,
#     so any token that can create repositories on an account can also delete them.
#     The exposure is limited by the double gate (no route in a production image), by
#     the value being read only when that route registers, and by the route's
#     timing-safe check of the POSTed `client_id`/`client_secret` against the App's
#     configured pair. Residual risk + the real exit (a dedicated throwaway/bot
#     account) are recorded in design-delta §11.8/§11.9.
#
# `SECRETS_ENCRYPTION_KEY` is likewise NOT overridden (D15) — the old all-zeros
# value here meant the api ENCRYPTED with a key dbos could not DECRYPT with.
# `GITHUB_E2E_PAT_TOKEN` STILL never enters any container: it is host-side
# harness-only, and row 66 minted a SECOND, SEPARATE `GITHUB_E2E_EXCHANGE_TOKEN`
# precisely so that property did not have to be reversed. The second token is not
# more narrowly SCOPED (see above — no create-without-delete GitHub credential
# exists); it is independently REVOCABLE, and it is the only one a container sees.
# Do not "simplify" the two into one.
#
# `tests/unit/compose-test-overlay.test.ts` enforces all of the above as a
# permanent NO-STUB GUARD — including an ALLOW-LIST over every `GITHUB_*` key, so a
# THIRD, unnamed one cannot slip in the way a fixed forbidden list would have let it.
services:
  api:
    environment:
      # MinIO wiring (Task #13). MinIO is real infra from docker-compose.yml, shared
      # by prod and test compose — it was never part of any stub harness.
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_BUCKET: supagloo-dev
      S3_ACCESS_KEY: supagloo
      S3_SECRET_KEY: supagloo-dev
      S3_REGION: us-east-1
      # Task #10's flag-gated `POST /v1/test/seed` seam (plan.md task 23: "obtain a
      # *real* session via the flag-gated POST /v1/test/seed instead of faking
      # browser state"). BOTH gates are required — see the header. DELETING EITHER
      # LINE RE-BREAKS ROW 62 ITEM (a).
      NODE_ENV: development
      SUPAGLOO_ENABLE_TEST_SEED: "1"
      # Plan row 66 — the SERVER-side half of the user-authorization host, and the
      # ONE credential the double-gated test-only exchange route hands back. Together
      # they let the nextjs browser lane drive the create-new-repo round trip against
      # real GitHub: the api completes the code→token hop against ITSELF over this
      # network, then `POST /user/repos` and the entire scaffold run for real. The two
      # gates above are what register that route at all; in a production image both
      # are false and it does not exist.
      #
      # NOTE: these lines make row 66 the only row in its block that ADDS config,
      # cutting against §11.2's "the delta is REMOVING the test-side overrides".
      # Recorded in design-delta §11.4 rather than left to be rediscovered.
      GITHUB_OAUTH_INTERNAL_BASE_URL: http://api:4000
      GITHUB_E2E_EXCHANGE_TOKEN: ${GITHUB_E2E_EXCHANGE_TOKEN}
